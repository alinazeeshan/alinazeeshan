name: Update GitHub Contributions

on:
  schedule:
    - cron: "17 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get GitHub contribution count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESPONSE=$(curl -s \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"query { user(login: \"alinazeeshan\") { contributionsCollection { contributionCalendar { totalContributions } } } }"}' \
            https://api.github.com/graphql)

          CONTRIBUTIONS=$(echo "$RESPONSE" | jq -r \
            '.data.user.contributionsCollection.contributionCalendar.totalContributions')

          echo "GitHub contribution count: $CONTRIBUTIONS"

          if [ "$CONTRIBUTIONS" = "null" ] || [ -z "$CONTRIBUTIONS" ]; then
            echo "Failed to get GitHub contributions"
            exit 1
          fi

          sed -i \
            "s/<!-- CONTRIBUTIONS_START -->.*<!-- CONTRIBUTIONS_END -->/<!-- CONTRIBUTIONS_START -->$CONTRIBUTIONS<!-- CONTRIBUTIONS_END -->/" \
            README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update GitHub contribution count"
            git push
          fi
